<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم الشفرة السرية 🕵️‍♂️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 18px; width: 100%; max-width: 500px; border: 1px solid #334155; }
        h1 { text-align: center; color: #38bdf8; font-size: 22px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 14px; font-weight: bold; }
        textarea { width: 100%; height: 100px; background: #0f172a; border: 1px solid #334155; color: #38bdf8; border-radius: 10px; padding: 12px; font-size: 16px; resize: none; margin-bottom: 15px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; }
        .btn-enc { background-color: #0284c7; }
        .btn-dec { background-color: #10b981; }
        .btn-copy { background-color: #334155; width: 100%; }
    </style>
</head>
<body>
<div class="card">
    <h1>مترجم الشفرة السرية 🕵️‍♂️</h1>
    <label>النص أو الشفرة:</label>
    <textarea id="inputText" placeholder="اكتب هنا..."></textarea>
    <div class="btn-group">
        <button class="btn-enc" onclick="processText(true)">تشفير 🔒</button>
        <button class="btn-dec" onclick="processText(false)">فك التشفير 🔓</button>
    </div>
    <label>النتيجة:</label>
    <textarea id="outputText" readonly placeholder="تظهر النتيجة هنا..."></textarea>
    <button class="btn-copy" onclick="copyResult()">نسخ النتيجة 📋</button>
</div>
<script>
    const cipherMap = {
        'ا': '-', 'أ': '-', 'إ': '-', 'آ': '-',
        'ب': '_', 'ت': '-', 'ث': '|', 'ج': '∆', 'ح': '§', 'خ': '×',
        'د': '؟', 'ذ': '%', 'ر': '"', 'ز': '!', 'س': '#', 'ش': '@',
        'ص': '`', 'ض': '~', 'ط': '/', 'ظ': '[', 'ع': 'π', 'غ': '√',
        'ف': '•', 'ق': '|', 'ك': 'ك', 'ل': '^', 'م': 'م', 'ن': '=',
        'ه': '¢', 'ة': '¢', 'و': '®', 'ي': '>', 'ى': '>'
    };
    const reverseCipherMap = {};
    for (let key in cipherMap) { if (!reverseCipherMap[cipherMap[key]]) reverseCipherMap[cipherMap[key]] = key; }

    function processText(isEncrypt) {
        const input = document.getElementById('inputText').value;
        const map = isEncrypt ? cipherMap : reverseCipherMap;
        let result = '';
        for (let char of input) { result += map[char] !== undefined ? map[char] : char; }
        document.getElementById('outputText').value = result;
    }
    function copyResult() {
        const output = document.getElementById('outputText');
        if (!output.value) return;
        navigator.clipboard.writeText(output.value);
        alert('تم النسخ بنجاح! 🤫');
    }
</script>
</body>
</html>
